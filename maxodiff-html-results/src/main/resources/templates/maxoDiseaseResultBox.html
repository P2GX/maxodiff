

<div class="container">
    <div class="section-box">
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-label">N MAxO Terms</div>
                <div class="stat-value stat-terms" th:text="${maxoDiseaseData.maxoHeaders.size}">2</div>
            </div>
        </div>

        <table class="countsTable">
            <thead>
            <tr>
                <th></th>
                <!-- Loop over MAxO terms-->
                <th th:each="entry : ${maxoDiseaseData.maxoHeaders}" class="vertical-header">
                    <div th:text="${entry.maxoLabel}"></div>
                </th>
            </tr>
            </thead>
            <!-- Now add one row for each of the diseases -->
            <tr th:each="row : ${maxoDiseaseData.resultsRows}">
                <!-- 1st column: OMIM label with link -->
                <td>
                    <a th:href="|https://www.omim.org/entry/${row.omimId}|"
                       th:text="${row.omimLabel}"></a>
                </td>

                <!-- Remaining columns: loop over MAxO table cells -->
                <th:block th:each="cell : ${row.getCells}">
                    <td class="parentCell">
                        <div class="hpoCell"
                             th:classappend="${cell.empty} ? ' emptyCell'"
                             th:style="${cell.empty} ? '' : 'background:' + ${cell.style}">
                            <span th:text="${cell.empty} ? '∅' : ${cell.score}"></span>
                        </div>
                    </td>
                </th:block>
            </tr>
        </table>
    </div>
</div>
