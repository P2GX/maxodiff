<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<div class="container">
    <div class="section-box">
        <h2 th:text="|${maxoData.index()}) ${maxoData.maxoId()}: ${maxoData.maxoLabel()}|">Header</h2>
    <div class="stats-row">
        <div class="stat-item">
            <div class="stat-label">ΔScore</div>
            <div class="stat-value stat-delta" th:text="${maxoData.deltaScore()}">8.49</div>
        </div>

        <div class="stat-item">
            <div class="stat-label">N Diseases</div>
            <div class="stat-value stat-diseases" th:utext="${maxoData.nDiseases()}">20</div>
        </div>

        <div class="stat-item">
            <div class="stat-label">N Observed HPO Terms</div>
            <div class="stat-value stat-terms" th:utext="${maxoData.nObservedHpoTerms()}">2</div>
        </div>
    </div>

<!--        TODO: change Sankey plot to show original disease rank on left and changed rank on right-->
    <div th:id="${'sankey-container-' + maxoData.index()}" class="sankey-plot"></div>
    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
    <script th:inline="javascript">
        var diseaseLabels = []
        var labels = []
        var sourceColors = ["red",
        "orange",
        "yellow",
        "green",
        "blue",
        "skyblue",
        "purple",
        "lightpink",
        "brown",
        "darkgray",
        "darkred",
        "darkorange",
        "gold",
        "darkgreen",
        "darkblue",
        "deepskyblue",
        "rebeccapurple",
        "hotpink",
        "saddlebrown",
        "gray"]
        var targetColors = [...sourceColors];
        var sources = []
        var targets = []
        var values  = []
        nodeSourceX = []
        nodeSourceY = []
        nodeTargetX = []
        nodeTargetY = []

        /*<![CDATA[*/
        var containerId = 'sankey-container-' + /*[[${maxoData.index}]]*/;
        var container = document.getElementById(containerId);
        console.log(containerId)
        console.log(container)

        var resultRows = /*[[${maxoData.resultRows}]]*/ [];
        resultRows.sort((a, b) => a.initialRank - b.initialRank);
        resultRows.forEach(function(row) {
            sourceIdx = row.initialRank - 1
            sources.splice(sourceIdx, 0, sourceIdx);
            labels.splice(sourceIdx, 0, row.omimLabel);
            nodeSourceX.push(0.0001)
            nodeSourceY.push(row.initialRank / row.nDiseases)
            values.push(1)
        });

        targetResultRows = resultRows.toSorted((a, b) => (a.initialRank + a.rankChange) - (b.initialRank + b.rankChange));
        targets = [...sources];
        console.log(targetResultRows)
        targetResultRows.forEach(function(row) {
            targetIdx = targetResultRows.indexOf(row)
            sourceIdx = row.initialRank - 1
            targets[sourceIdx] = resultRows.length + targetIdx;
            targetColors[targetIdx] = sourceColors[sourceIdx];
            labels.push(row.omimLabel);
            nodeTargetX.push(0.9999)
            nodeTargetY.push((targetIdx + 1) / row.nDiseases)
            values.push(1)
        });
        /*]]>*/

        var nodeX = nodeSourceX.concat(nodeTargetX);
        var nodeY = nodeSourceY.concat(nodeTargetY);
        var nodeColors = sourceColors.concat(targetColors);

        var data = {
          type: "sankey",
          orientation: "h",
          node: {
            x: nodeX,
            y: nodeY,
            color: nodeColors,
            pad: 15,
            thickness: 20,
            line: { color: "black", width: 0.5 },
            label: labels
          },
          link: {
            source: sources,
            target: targets,
            value: values
          }
        };
        Plotly.newPlot(container, [data], {
          margin:{t:10,l:10,r:10,b:10},
          font: { size: 12 }
        });
    </script>

    <table class="countsTable">
        <thead>
        <tr>
            <th></th>
            <th class="deltaR-header">
                <span class="deltaR">&#916;&thinsp;R</span>
            </th>
            <th></th>
            <!-- Loop over HPO terms-->
            <th th:each="entry : ${maxoData.hpoHeaders}" class="vertical-header">
                <a th:href="|https://hpo.jax.org/browse/term/${entry.termId}|">
                    <div th:text="${entry.termLabel}"></div>
                </a>
            </th>
        </tr>
        </thead>
        <!-- the following is the N Repetitions row -->
        <tr>
            <!-- Empty cells (needed to align with correct column) -->
            <td>Observed in</td><td></td><td></td>
            <!-- Loop over repetition cells -->
            <td th:each="cell : ${maxoData.repetitionCells}"
                class="repetitionCell"
                >
                <div class="repetitionColorBox" th:style="'background:' + ${cell.background}">
                    <span th:text="${cell.count}">0</span>
                </div>
                <div class="tooltip">
                    <div class="tooltip-header" th:text="${cell.toolTipHeader}">Header</div>
                    <div class="tooltip-subheader">Annotation frequency</div>
                    <ul  class="tooltip-list">
                        <li th:each="item: ${cell.toolTipItems}">
                            <span th:text="${item.hpo}">HPO Term</span>:
                            <strong th:text="${item.percentage}">0%</strong>
                        </li>
                    </ul>
                </div>
            </td>
        </tr>
        <!-- Now add one row for each of the diseases -->
        <tr th:each="row : ${maxoData.resultRows}">
            <!-- 1st column: OMIM label with link -->
            <td>
                <a th:href="|https://www.omim.org/entry/${row.omimIdDigits}|"
                   th:text="${row.omimLabel}"></a>
            </td>
            <!-- 2nd column: rank change -->
            <td class="parentCell">
                <div class="hpoCell"
                     th:text="${row.rankChange}"
                     th:style="|background: ${row.style}|">
                </div>
            </td>
            <!-- 3rd column: empty (this is a space hider. TODO-lets refactor and do this with CSS -->
            <td></td>

            <!-- Remaining columns: loop over HPO table cells -->
            <th:block th:each="cell : ${row.getCells}">
                <td class="parentCell">
                    <div class="hpoCell"
                         th:classappend="${cell.empty} ? ' emptyCell'"
                         th:style="${cell.empty} ? '' : 'background:' + ${cell.style}">
                        <span th:text="${cell.empty} ? '∅' : ${cell.count}"></span>
                    </div>
                </td>
            </th:block>
        </tr>
    </table>
    </div>
</div>
