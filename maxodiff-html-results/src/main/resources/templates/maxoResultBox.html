

<div class="container">
    <div class="section-box">
        <h2 th:text="|${maxoData.index()}) ${maxoData.maxoId()}: ${maxoData.maxoLabel()}|">Header</h2>
    <div class="stats-row">
        <div class="stat-item">
            <div class="stat-label">ΔScore</div>
            <div class="stat-value stat-delta" th:text="${maxoData.deltaScore()}">8.49</div>
        </div>

        <div class="stat-item">
            <div class="stat-label">N Diseases</div>
            <div class="stat-value stat-diseases" th:text="${maxoData.nDiseases()}">20</div>
        </div>

        <div class="stat-item">
            <div class="stat-label">N Observed HPO Terms</div>
            <div class="stat-value stat-terms" th:text="${maxoData.nObservedHpoTerms()}">2</div>
        </div>
    </div>

    <table class="countsTable">
        <thead>
        <tr>
            <th></th>
            <th class="deltaR-header">
                <span class="deltaR">&#916;&thinsp;R</span>
            </th>
            <th></th>
            <!-- Loop over HPO terms-->
            <th th:each="entry : ${maxoData.hpoHeaders}" class="rotated-header">
                <a th:href="|https://hpo.jax.org/browse/term/${entry.key}|">
                    <div th:text="${entry.value}"></div>
                </a>
            </th>
        </tr>
        </thead>
        <!-- the following is the N Repetitions row -->
        <tr>
            <!-- Empty cells (needed to align with correct column) -->
            <td>Observed in</td><td></td><td></td>
            <!-- Loop over repetition cells -->
            <td th:each="cell : ${maxoData.repetitionCells}"
                class="repetitionCell"
                >
                <div class="repetitionColorBox" th:style="'background:' + ${cell.background}">
                    <span th:text="${cell.count}">0</span>
                </div>
                <span class="tooltip" th:utext="${cell.tooltipHtml}"></span>
            </td>
        </tr>
        <!-- Now add one row for each of the diseases -->
        <tr th:each="row : ${maxoData.resultRows}">
        <!-- 1st column: OMIM label with link -->
        <td>
            <a th:href="|https://www.omim.org/entry/${row.omimId}|"
               th:text="${row.omimLabel}"></a>
        </td>
        <!-- 2nd column: rank change -->
        <td th:text="${row.rankChange}"></td>

        <!-- 3rd column: number of diseases -->
        <td th:text="${row.nDiseases}"></td>

        <!-- Remaining columns: loop over HPO table cells -->
        <td th:each="cell : ${row.cells}" class="parentCell">
            <div class="repetitionColorBox"
                 th:style="'background:' + ${cell.getOpacity()}">
                <span th:text="${cell.count}">0</span>
            </div>
        </td>
        </tr>>
    </table>
    </div>
</div>
