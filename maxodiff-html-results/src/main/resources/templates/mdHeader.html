<section class="patient-card" aria-label="Patient summary">
    <dl>
        <div class="term-row">
            <dt>Observed HPO terms</dt>
            <dd>
                <a class="term observed" th:each="term : ${observedHpoTerms}"
                   th:href="|https://hpo.jax.org/browse/term/${term.tid}|" target="_blank"
                   th:title="${term.tid}" th:text="${term.label}">term</a>
                <span class="none" th:if="${#lists.isEmpty(observedHpoTerms)}">none</span>
            </dd>
        </div>
        <div class="term-row">
            <dt>Excluded HPO terms</dt>
            <dd>
                <a class="term excluded" th:each="term : ${excludedHpoTerms}"
                   th:href="|https://hpo.jax.org/browse/term/${term.tid}|" target="_blank"
                   th:title="${term.tid}" th:text="${term.label}">term</a>
                <span class="none" th:if="${#lists.isEmpty(excludedHpoTerms)}">none</span>
            </dd>
        </div>
    </dl>
</section>
