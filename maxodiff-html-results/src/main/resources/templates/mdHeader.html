
<table class="resultsTable">
    <tbody>
        <tr class="spaced-row">
            <td class="narrow-column">Observed HPO Terms:</td>
            <td class="wide-column">
                <a th:each="term : ${observedHpoTerms}"
                   th:href="|https://hpo.jax.org/browse/term/${term.termId}|" target="_blank"
                   th:text="${term.termLabel}">
                </a>
            </td>
        </tr>
        <tr class="spaced-row">
            <td class="narrow-column">Excluded HPO Terms:</td>
            <td class="wide-column">
                <a th:each="term : ${excludedHpoTerms}"
                   th:href="|https://hpo.jax.org/browse/term/${term.termId}|" target="_blank"
                   th:text="${term.termLabel}">
                </a>
            </td>
        </tr>
        <tr class="spaced-row">
            <td class="narrow-column">Diseases:</td><td class="wide-column" th:text="${nDiseases}">n Diseases</td>
        </tr>
        <tr>
            <td class="narrow-column">Simulations:</td><td class="wide-column" th:text="${nRepetitions}">n Simulations</td>
        </tr>
    </tbody>
</table>
