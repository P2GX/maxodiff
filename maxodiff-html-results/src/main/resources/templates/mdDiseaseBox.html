<div class="container">
    <div class="section-box">
        <h2>Overview: effect of each test on each disease</h2>
        <p class="matrix-legend">
            <span><span class="swatch up"></span>moves up the list (smaller rank number)</span>
            <span><span class="swatch down"></span>moves down the list</span>
            <span>Darker = larger change. Numbers are rank positions. Hover a cell for details.</span>
        </p>
        <div class="matrix-wrap">
            <table class="matrix">
                <caption class="visually-hidden">Average rank change of each disease for the best tests</caption>
                <thead>
                <tr>
                    <th scope="col" class="m-row">Test</th>
                    <th scope="col" class="m-col" th:each="column : ${matrix.columns}" th:title="${column.label()}">
                        <span>
                            <a th:if="${column.url() != null}" th:href="${column.url()}" target="_blank" rel="noopener noreferrer"
                               th:text="|${column.initialRank()} ${column.shortLabel()}|">1 Marfan syndrome</a>
                            <span th:unless="${column.url() != null}"
                                  th:text="|${column.initialRank()} ${column.shortLabel()}|">1 Marfan syndrome</span>
                        </span>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${matrix.rows}">
                    <th scope="row" class="m-row">
                        <span class="m-pos" th:text="${row.position()}">1</span>
                        <span class="m-label" th:text="${row.maxoLabel()}" th:title="${row.maxoLabel()}">Test</span>
                    </th>
                    <td class="m-cell" th:each="cell : ${row.cells()}"
                        th:classappend="${cell.isEmpty()} ? 'none'"
                        th:style="${cell.style()}" th:title="${cell.title()}" th:text="${cell.text()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
